<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign clusters</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-row">
      <h1>Campaign clusters</h1>
      <label class="header-toggle" id="evalMetricsToggleWrap" hidden>
        <input type="checkbox" id="showEvalMetrics" />
        Show H/C/V on campaigns
      </label>
    </div>
    <p class="muted" id="runInfo"></p>
    <p class="legend muted" id="simLegend">
      Colors compare each field and URL to peers in the <strong>same campaign</strong> (SBERT; red = lowest relative match, green = highest). Percentages are scaled per campaign so differences stay visible.
    </p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <aside class="panel campaigns">
      <h2>Campaigns</h2>
      <p class="campaign-summary muted" id="campaignSummary" hidden></p>
      <ul id="campaignList"></ul>
    </aside>
    <aside class="panel emails">
      <h2>Emails in campaign</h2>
      <ul id="emailList"></ul>
    </aside>
    <main class="panel detail">
      <h2>Email</h2>
      <div id="emailDetail" class="email-container">
        <p class="muted">Select a campaign, then an email.</p>
      </div>
    </main>
  </div>

  <script src="/static/app.js?v=14"></script>
</body>
</html>
